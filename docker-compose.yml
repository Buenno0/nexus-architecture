services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: nexus-dynamodb
    # -sharedDb: uma unica base, independente de credencial/regiao. Sem isso cada
    # combinacao de credenciais enxerga um banco separado e os dados "somem".
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    # Teto explicito de recursos — Fase 7.
    #
    # Sem isso, API, banco e gerador de carga disputam os mesmos nucleos e o numero
    # medido depende de quem ganhou o escalonador naquele segundo. Com o teto, a
    # medicao vira reprodutivel e passa a ter uma unidade: "2 nucleos".
    cpus: ${NEXUS_DYNAMO_CPUS:-2.0}
    mem_limit: ${NEXUS_DYNAMO_MEM:-2g}
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET / HTTP/1.0\r\n\r\n" >&3 && head -c 64 <&3 | grep -q HTTP'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    container_name: nexus-api
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      NEXUS_ENV: local
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
      NEXUS_DYNAMO_ENDPOINT: http://dynamodb:8000
      NEXUS_DYNAMO_TABLE: ${NEXUS_DYNAMO_TABLE:-nexus-records}
      NEXUS_AWS_REGION: us-east-1
      # Fila local — ADR-004. Em volume nomeado, NAO em bind mount: SQLite em modo
      # WAL depende de memoria compartilhada e locks POSIX que nao atravessam a
      # fronteira host/VM no macOS. Todo acesso a fila acontece dentro do container.
      NEXUS_QUEUE_BACKEND: ${NEXUS_QUEUE_BACKEND:-sqlite}
      NEXUS_QUEUE_PATH: /data/nexus-queue.db
      NEXUS_FAILURE_INJECTION_RATE: ${NEXUS_FAILURE_INJECTION_RATE:-0.0}
      # Desliga a gravacao da trilha — ADR-010. A Fase 7 compara os dois lados.
      NEXUS_TRAIL_ENABLED: ${NEXUS_TRAIL_ENABLED:-true}
      # Demonstracao publica — Fase 9. Fora do modo demo a rota /v1/demo/seed nao
      # existe e a ingestao livre continua disponivel, como no desenvolvimento normal.
      NEXUS_DEMO_MODE: ${NEXUS_DEMO_MODE:-false}
      NEXUS_DEMO_MAX_PER_CALL: ${NEXUS_DEMO_MAX_PER_CALL:-200}
      NEXUS_DEMO_MAX_TOTAL: ${NEXUS_DEMO_MAX_TOTAL:-5000}
      # Pool de conexoes do cliente DynamoDB. Padrao do botocore e 10 — Fase 7.
      NEXUS_DYNAMO_MAX_POOL_CONNECTIONS: ${NEXUS_DYNAMO_MAX_POOL_CONNECTIONS:-10}
      # Credenciais falsas exigidas pelo SDK para falar com o DynamoDB Local.
      # Nao sao segredos — ver SECURITY.md.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8080:8080"
    volumes:
      - queue-data:/data
    # Sem healthcheck, 'docker compose up --wait' devolve assim que o container esta
    # *rodando* — e o uvicorn ainda nao abriu a porta. Quem chamasse a API logo em
    # seguida levaria connection reset, de forma intermitente e dificil de atribuir.
    # Encontrado ao executar scripts/demo.sh pela primeira vez. Fase 8.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    cpus: ${NEXUS_API_CPUS:-2.0}
    mem_limit: ${NEXUS_API_MEM:-2g}
    command:
      - sh
      - -c
      # --workers e variavel desde a Fase 7. Com um unico processo, o teto de
      # throughput e o de um nucleo, e mediriamos a configuracao em vez da
      # arquitetura. O padrao segue 1: e o que o desenvolvimento usa, e mudar o
      # padrao por causa de um teste de carga seria otimizar para o benchmark.
      - python -m nexus.persistence.tables && exec uvicorn nexus.ingestion.api:app --host 0.0.0.0 --port 8080 --workers ${NEXUS_API_WORKERS:-1}

volumes:
  dynamodb-data:
  queue-data:
