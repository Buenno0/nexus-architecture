[project]
name = "nexus-architecture"
version = "0.1.0"
description = "Plataforma experimental de engenharia de sistemas distribuidos"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[dynamodb,sqs]>=1.35.0",
    "faker>=30.0.0",
    "locust>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
# Handlers de excecao e lifespan recebem argumentos exigidos pela assinatura do
# framework; nem todos sao usados. Nao sao argumentos esquecidos.
"src/nexus/ingestion/api.py" = ["ARG001"]
# A implementacao nula precisa aceitar a assinatura completa do contrato, ainda que
# nao use os argumentos. Nao sao parametros esquecidos.
"src/nexus/queue/client.py" = ["ARG002"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["nexus"]

[[tool.mypy.overrides]]
module = ["tests.*", "tools.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requer DynamoDB Local em execucao",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/nexus"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
